buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Compile the reviewed Debug fixture only into the smoke host-test lane.
// Neither fixture nor host witnesses are included in the library's production source sets.
gradle.projectsEvaluated {
    def core = rootProject.findProject(':react-native-notify-kit')
    core.android.sourceSets.test.java.srcDir(rootProject.file('host-tests'))
    core.android.sourceSets.test.java.srcDir(rootProject.file('app/src/debug/java/app/notifee/core'))
    core.tasks.withType(Test).configureEach {
        filter {
            ['IndependentBatchTest', 'IndependentStorageTest', 'Issue82P7Test'].each { witness ->
                // These fixtures inherit setup/helpers. Run inherited tests once in the base suite.
                ['T*', 'audit*', 'B82*', 'GC*', 'PUB*'].each { inherited ->
                    excludeTestsMatching("app.notifee.core.${witness}.${inherited}")
                }
            }
        }
    }
}
